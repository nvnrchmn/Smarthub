name: Deploy

# Deploy manual ke VPS smarthub.logikraf.id.
# Menjalankan skrip build lokal di VPS (build-lokal.sh) — sama seperti alur
# operasional yang sudah terbukti, sehingga Prisma client tetap hidup di
# pnpm store VPS (menghindari error "Named export 'Prisma' not found").
#
# Prasyarat secret repo: VPS_HOST, VPS_USER, VPS_SSH_KEY.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref git di repo VPS yang akan di-deploy"
        required: true
        default: main

concurrency:
  group: deploy-smarthub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key

          # Normalisasi: secret kadang tersimpan 1 baris (newline ter-escape)
          # atau ter-encode base64. Coba pulihkan agar tetap bisa dipakai.
          if ! grep -q "PRIVATE KEY" ~/.ssh/deploy_key; then
            sed 's/\\n/\n/g' ~/.ssh/deploy_key > ~/.ssh/deploy_key.esc 2>/dev/null || true
            if grep -q "PRIVATE KEY" ~/.ssh/deploy_key.esc 2>/dev/null; then
              mv ~/.ssh/deploy_key.esc ~/.ssh/deploy_key
            fi
          fi
          if ! grep -q "PRIVATE KEY" ~/.ssh/deploy_key; then
            if base64 -d ~/.ssh/deploy_key > ~/.ssh/deploy_key.dec 2>/dev/null && grep -q "PRIVATE KEY" ~/.ssh/deploy_key.dec 2>/dev/null; then
              mv ~/.ssh/deploy_key.dec ~/.ssh/deploy_key
            fi
          fi

          chmod 600 ~/.ssh/deploy_key
          echo "deploy_key lines: $(wc -l < ~/.ssh/deploy_key)"
          echo "deploy_key header: $(head -n1 ~/.ssh/deploy_key)"
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1 && echo "private key: OK" || echo "private key: INVALID"
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, build, dan rilis di VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "set -e; cd ~/Projects/Smarthub; git fetch origin; git checkout ${{ inputs.ref }}; git reset --hard origin/${{ inputs.ref }}; echo '--- diag ---'; whoami; id; ls -la /tmp/build-lokal.lock || true; sudo rm -f /tmp/build-lokal.lock; sudo build-lokal.sh smarthub build; sudo build-lokal.sh smarthub rilis; echo DEPLOY_OK"

      - name: Smoke test
        run: |
          set -e
          curl -fsS -o /dev/null https://smarthub.logikraf.id/
          curl -fsS -o /dev/null https://smarthub.logikraf.id/login
          curl -fsS -o /dev/null https://smarthub.logikraf.id/robots.txt
          curl -fsS -o /dev/null https://smarthub.logikraf.id/sitemap.xml
          echo "Smoke test OK"
